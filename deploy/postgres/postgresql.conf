# PostgreSQL for the local Docker stack: 4 CPUs, a 1.5 GB container limit, applications
# connect through PgBouncer. Re-tune on real hardware in Phase 8 (see docs/CAPACITY.md).

listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3
password_encryption = scram-sha-256  # pragma: allowlist secret

# Memory
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 128MB
huge_pages = off
dynamic_shared_memory_type = posix

# Durability: bookings and payments must never be lost, so synchronous_commit stays on.
wal_level = replica
synchronous_commit = on
wal_compression = on
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# Planner / IO (SSD storage)
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1

# Fail fast instead of piling up behind stuck work.
lock_timeout = 5s
idle_in_transaction_session_timeout = 15s
deadlock_timeout = 1s

# Observability
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on
log_destination = 'stderr'
log_min_duration_statement = 500
log_lock_waits = on
log_checkpoints = on
log_connections = off
log_disconnections = off
log_statement = 'ddl'
log_line_prefix = '%m [%p] %u@%d '

timezone = 'UTC'
log_timezone = 'UTC'
