# Redis for seat holds, the waiting room, throttle counters and the Celery broker.
# Reachable only on the internal Docker network, and a password is required
# (passed on the command line as --requirepass, so it never lives in this file).

bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
tcp-keepalive 60
timeout 0
maxclients 10000

# Never evict: silently dropping a seat hold would be a correctness bug. When memory is full,
# writes fail loudly instead (the API turns that into a 503) and we scale up.
maxmemory 768mb
maxmemory-policy noeviction

# Append-only file with per-second fsync: a crash loses at most about 1 second of holds and
# queue tickets. PostgreSQL remains the source of truth for bookings.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save ""

lazyfree-lazy-user-del yes
slowlog-log-slower-than 10000
slowlog-max-len 128
loglevel notice
logfile ""

# Disable the most destructive commands.
rename-command FLUSHALL ""
rename-command DEBUG ""
