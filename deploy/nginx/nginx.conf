# Edge proxy for RailRush. Runs unprivileged (nginxinc/nginx-unprivileged) and listens on 8080.
# It is the only container reachable from outside the Docker network.

worker_processes auto;
worker_rlimit_nofile 262144;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    default_type application/json;
    server_tokens off;

    # Paths only (never query strings) so tokens cannot leak into logs.
    log_format api '$remote_addr "$request_method $uri" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /dev/stdout api;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    proxy_cache_path      /tmp/nginx_cache levels=1:2 keys_zone=micro:10m max_size=64m inactive=10s use_temp_path=off;

    # Small API bodies only, and short timeouts, so slow-client attacks cannot hold connections.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    large_client_header_buffers 4 8k;

    # Per-IP limits. Deliberately generous: mobile carriers put thousands of users behind one
    # IP (CGNAT), so tight limits would punish real customers. Tuned in Phase 8.
    limit_req_zone  $binary_remote_addr zone=perip:20m rate=100r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m  rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=connperip:20m;
    limit_req_status 429;
    limit_conn_status 429;

    # Content-Security-Policy for API paths only; the Django admin (HTML) is left alone.
    map $uri $api_csp {
        default "";
        ~^/api/ "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
    }

    upstream web {
        server web:8000;
        keepalive 256;
        keepalive_requests 1000;
        keepalive_timeout 30s;
    }

    # Errors generated by nginx itself use the same JSON envelope as the API.
    error_page 403 = @forbidden;
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @upstream_unavailable;

    server {
        listen 8080 backlog=4096 default_server;
        server_name _;

        limit_conn connperip 300;

        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        add_header Content-Security-Policy $api_csp always;

        # Settings shared by every proxied location. This is the edge, so X-Forwarded-For is
        # overwritten with the real peer address: a client-supplied value can never survive.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header Server;

        # Container health check (loopback only).
        location = /nginx-health {
            access_log off;
            allow 127.0.0.1;
            deny all;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Prometheus metrics are for the internal network only.
        location /internal/ {
            return 404;
        }

        # Readiness reveals dependency state: private networks only.
        location = /api/health/ready/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://web;
        }

        # Login and sign-up: strict per-IP limit on top of the general one.
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req zone=perip burst=200 nodelay;
            proxy_pass http://web;
        }

        # Public read endpoints get a 1-second micro-cache so thousands of identical requests
        # become one request to Django. Authenticated requests are never cached or served from
        # cache. The endpoints themselves arrive in Phases 4 and 5.
        location ~ ^/api/(catalog/|waitroom/[0-9]+/status/) {
            limit_req zone=perip burst=200 nodelay;
            proxy_cache micro;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$request_method$host$uri$is_args$args";
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
            proxy_cache_bypass $http_authorization $http_cookie;
            proxy_no_cache $http_authorization $http_cookie;
            proxy_pass http://web;
        }

        location / {
            limit_req zone=perip burst=200 nodelay;
            proxy_pass http://web;
        }

        location @forbidden {
            default_type application/json;
            return 403 '{"error":{"code":"permission_denied","message":"You do not have permission to perform this action."}}';
        }

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":{"code":"throttled","message":"Too many requests. Please slow down."}}';
        }

        location @upstream_unavailable {
            default_type application/json;
            add_header Retry-After 5 always;
            return 503 '{"error":{"code":"unavailable","message":"Service temporarily unavailable. Please retry shortly."}}';
        }
    }
}
