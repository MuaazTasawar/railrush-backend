# Observability: Prometheus, Grafana and two exporters. Run together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# The bootstrap block pins the image digests and generates the passwords into .env.
# Prometheus has no published port. Grafana is published on 127.0.0.1 only.

x-obs-hardening: &obs-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  prometheus:
    image: "${PROMETHEUS_IMAGE:?Run the observability bootstrap first (it pins image digests in .env)}"
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=1GB"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    <<: *obs-hardening
    networks: [backend, monitor]

  redis-exporter:
    image: "${REDIS_EXPORTER_IMAGE:?Run the observability bootstrap first (it pins image digests in .env)}"
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    mem_limit: 64m
    <<: *obs-hardening
    networks: [backend]

  postgres-exporter:
    image: "${POSTGRES_EXPORTER_IMAGE:?Run the observability bootstrap first (it pins image digests in .env)}"
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?sslmode=disable"
      DATA_SOURCE_USER: "railrush_monitor"
      DATA_SOURCE_PASS: "${POSTGRES_EXPORTER_PASSWORD:?Run the observability bootstrap first}"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 96m
    <<: *obs-hardening
    networks: [backend]

  grafana:
    image: "${GRAFANA_IMAGE:?Run the observability bootstrap first (it pins image digests in .env)}"
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Run the observability bootstrap first}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SERVER_ROOT_URL: "http://127.0.0.1:${GRAFANA_HOST_PORT:-3030}"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3030}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    mem_limit: 384m
    <<: *obs-hardening
    networks: [monitor, edge]

networks:
  monitor:
    internal: true

volumes:
  promdata:
  grafanadata:
